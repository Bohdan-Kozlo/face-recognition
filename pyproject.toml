[project]
name = "face-recognition"
version = "0.1.0"
description = "Educational face verification authentication prototype"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3,<3",
    "opencv-python-headless>=4.13,<5",
    "pillow>=12.1,<13",
    "timm>=1.0.28,<1.1",
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pandas>=2.3.3",
]
training = [
    "mlflow>=3.15.1",
    "pytorch-metric-learning>=2.9.0",
    "tqdm>=4.70.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
